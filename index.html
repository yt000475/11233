<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中華民國憲法概要 - 專屬刷題機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        .option-btn {
            transition: all 0.15s ease-in-out;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 頂部導航列 -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <h1 class="text-lg md:text-xl font-bold tracking-wide">憲法概要刷題機 <span class="text-xs font-normal bg-indigo-800 px-2 py-0.5 rounded-full ml-1">全245題</span></h1>
            </div>
            
            <!-- 模式切換 Tabs -->
            <nav class="flex space-x-1 bg-indigo-800/70 p-1 rounded-lg text-sm">
                <button onclick="switchTab('practice')" id="tab-practice" class="px-3 py-1.5 rounded-md font-medium transition bg-white text-indigo-700 shadow-sm">
                    全部刷題
                </button>
                <button onclick="switchTab('wrong-practice')" id="tab-wrong-practice" class="px-3 py-1.5 rounded-md font-medium transition text-indigo-100 hover:text-white flex items-center">
                    錯題專練
                    <span id="badge-wrong-count" class="ml-1.5 bg-rose-500 text-white text-xs px-1.5 py-0.2 rounded-full">0</span>
                </button>
                <button onclick="switchTab('wrong-list')" id="tab-wrong-list" class="px-3 py-1.5 rounded-md font-medium transition text-indigo-100 hover:text-white">
                    錯題統整本
                </button>
            </nav>
        </div>
    </header>

    <!-- 統計與控制面板 -->
    <div class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-sm">
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <span class="text-slate-500 mr-1">已作答：</span>
                    <span id="stat-answered" class="font-bold text-slate-800">0</span>
                    <span class="text-slate-400 mx-1">/</span>
                    <span id="stat-total" class="text-slate-600">245</span>
                </div>
                <div class="flex items-center">
                    <span class="text-slate-500 mr-1">答對率：</span>
                    <span id="stat-accuracy" class="font-bold text-emerald-600">0%</span>
                </div>
                <div class="flex items-center">
                    <span class="text-slate-500 mr-1">錯題數：</span>
                    <span id="stat-wrong" class="font-bold text-rose-600">0</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <label class="inline-flex items-center cursor-pointer select-none text-slate-600 hover:text-slate-900">
                    <input type="checkbox" id="toggle-random" onchange="toggleRandomMode()" class="rounded text-indigo-600 focus:ring-indigo-500 mr-1.5">
                    <span>隨機出題</span>
                </label>
                <span class="text-slate-300">|</span>
                <button onclick="openJumpModal()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                    題號跳轉
                </button>
                <span class="text-slate-300">|</span>
                <button onclick="resetProgress()" class="text-slate-500 hover:text-rose-600 transition text-xs">
                    重置紀錄
                </button>
            </div>
        </div>
    </div>

    <!-- 主內容區 -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        
        <!-- 刷題視圖 (全部刷題 & 錯題專練共用) -->
        <div id="view-quiz" class="space-y-6">
            <!-- 空錯題提示 (僅在錯題專練且無錯題時顯示) -->
            <div id="empty-wrong-state" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">太棒了！目前沒有錯題</h2>
                <p class="text-slate-500 mb-6">你的錯題本是空的，繼續保持或前往「全部刷題」挑戰更多題目吧！</p>
                <button onclick="switchTab('practice')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition">
                    前往全部刷題
                </button>
            </div>

            <!-- 題目卡片 -->
            <div id="quiz-card" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <!-- 題目頂部資訊列 -->
                <div class="bg-slate-50 px-6 py-3.5 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span id="q-mode-tag" class="text-xs font-bold px-2.5 py-1 rounded bg-indigo-100 text-indigo-700">全部題庫</span>
                        <span class="text-sm font-bold text-slate-700">第 <span id="q-number" class="text-indigo-600 text-base">1</span> 題</span>
                        <span id="q-progress-text" class="text-xs text-slate-400">(進度 1 / 245)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="btn-remove-wrong" onclick="removeCurrentFromWrong()" class="hidden text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 px-2.5 py-1 rounded-md transition flex items-center">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            我已學會，移出錯題
                        </button>
                    </div>
                </div>

                <!-- 題幹 -->
                <div class="p-6 md:p-8">
                    <h2 id="q-text" class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed mb-6">
                        題目載入中...
                    </h2>

                    <!-- 選項列表 -->
                    <div id="options-container" class="space-y-3">
                        <!-- 選項按鈕由 JS 動態生成 -->
                    </div>

                    <!-- 即時反饋區塊 -->
                    <div id="feedback-box" class="hidden mt-6 p-4 rounded-xl border">
                        <div class="flex items-start space-x-3">
                            <div id="feedback-icon" class="mt-0.5 flex-shrink-0"></div>
                            <div class="flex-grow">
                                <h3 id="feedback-title" class="font-bold text-base"></h3>
                                <p id="feedback-detail" class="text-sm mt-1"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 底部導航按鈕 -->
                <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                    <button id="btn-prev" onclick="prevQuestion()" class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 font-medium text-sm transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        上一題
                    </button>

                    <div class="flex items-center space-x-2">
                        <label class="inline-flex items-center text-xs text-slate-500 cursor-pointer select-none mr-2">
                            <input type="checkbox" id="auto-next-correct" class="rounded text-indigo-600 mr-1">
                            答對自動下一題
                        </label>
                        <button id="btn-next" onclick="nextQuestion()" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm shadow-sm transition flex items-center">
                            下一題
                            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 錯題統整本視圖 -->
        <div id="view-wrong-list" class="hidden space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">錯題統整本</h2>
                    <p class="text-sm text-slate-500 mt-1">自動記錄所有答錯的題目，方便考前總複習與檢視盲點。</p>
                </div>
                <div class="flex space-x-2">
                    <button onclick="switchTab('wrong-practice')" id="btn-start-wrong-practice" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition">
                        開始專練這些錯題
                    </button>
                    <button onclick="clearAllWrong()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-3 py-2 rounded-lg transition">
                        清空錯題本
                    </button>
                </div>
            </div>

            <div id="wrong-list-container" class="space-y-3">
                <!-- 錯題卡片由 JS 動態渲染 -->
            </div>
        </div>

    </main>

    <!-- 題號跳轉 Modal -->
    <div id="jump-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-800">題庫總覽與快速跳轉</h3>
                    <div class="flex items-center space-x-3 text-xs mt-1 text-slate-500">
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1"></span>答對</span>
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 mr-1"></span>答錯</span>
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-slate-200 mr-1"></span>未作答</span>
                    </div>
                </div>
                <button onclick="closeJumpModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="jump-grid" class="p-6 overflow-y-auto grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2">
                <!-- 題號按鈕由 JS 動態生成 -->
            </div>
        </div>
    </div>

    <script>
        // 完整 245 題題庫資料 (依 PDF 內容精準轉錄與校對)
        const rawQuestions = [
            { id: 1, q: "下列何者與國史館隸屬同一機關？", opts: ["審計部。", "公務人員保障暨培訓委員會。", "行政院文化建設委員會。", "中央研究院。"], ans: "D" },
            { id: 2, q: "依照憲法修改的難易程序分類，我國憲法為何種憲法？", opts: ["五權憲法。", "民定憲法。", "成文憲法。", "剛性憲法。"], ans: "D" },
            { id: 3, q: "合乎立憲主義的憲法必然要「權力分立」，但下列描述何者錯誤？", opts: ["必然是成文憲法才能架構權力分立。", "權力分立乃是對權力不信任的制度性措施。", "權力分立是為了保障自由及人權。", "分立之外還要平衡，以免某項權力獨大。"], ans: "A" },
            { id: 4, q: "動員戡亂臨時條款第一次制定時是對總統憲法上哪一個權力放寬？", opts: ["任期。", "緊急權力。", "遴選僑選中央民代。", "予增額立委選舉法源。"], ans: "B" },
            { id: 5, q: "憲法、法律及命令三者之效力，依高低位階排列，應為：", opts: ["命令、法律、憲法。", "法律、命令、憲法。", "法律、憲法、命令。", "憲法、法律、命令。"], ans: "D" },
            { id: 6, q: "依我國憲法規定，有關憲法修改之敘述何者為是？", opts: ["由監察院先行提出修正案，再由國民大會複決之。", "由行政院提出，再全民公投。", "由立法院提出後，再交由全民複決之。", "由立法院提出，再交由國民大會複決之。"], ans: "C" },
            { id: 7, q: "「有憲法的國家不一定有憲政」這一句話的詮釋不包括：", opts: ["有一些國家的憲法不合乎現代立憲主義的原理。", "空有漂亮的憲法典但未被遵行，等於沒有憲法。", "合乎立憲主義的國家必有一部憲法典。", "我國在戒嚴時期長久未實行憲法本文即是一例。"], ans: "C" },
            { id: 8, q: "憲法若是由君主獨斷權力所制定者，稱為：", opts: ["剛性憲法。", "協定憲法。", "欽定憲法。", "柔性憲法。"], ans: "C" },
            { id: 9, q: "下列那一國家採行之憲法為不成文憲法？", opts: ["美國。", "英國。", "德國。", "我國。"], ans: "B" },
            { id: 10, q: "我國憲法施行日期為何？", opts: ["民國35年12月25日。", "民國36年1月1日。", "民國36年12月25日。", "民國25年5月5日。"], ans: "C" },
            { id: 11, q: "下列何者是世界第一部成文憲法典？", opts: ["美國聯邦憲法。", "英國憲法。", "日本國憲法。", "我國憲法。"], ans: "A" },
            { id: 12, q: "依憲法增修條文及司法院大法官之解釋，下列有關修憲之敘述何者為是？", opts: ["修憲內容有一定界限。", "修憲程序以秘密為原則。", "提案修憲機關為國民大會。", "憲法修正案不須經公民投票方有效力。"], ans: "A" },
            { id: 13, q: "國家之內由政府各機關所制定的一切規範中，應有層次分明的位階關係，下級規範不得牴觸上級規範，此即：", opts: ["比例原則。", "法律保留原則。", "法律優位原則。", "信賴保護原則。"], ans: "C" },
            { id: 14, q: "我國憲法條文中有時會出現某事項應「以法律定之」的文字。這樣的用語和規定反映的是下列那一種憲法原理？", opts: ["憲法保留原則。", "法律保留原則。", "比例原則。", "明確性原則。"], ans: "B" },
            { id: 15, q: "我國現行憲法是在那一年由國民大會制定通過？", opts: ["民國34年。", "民國35年。", "民國36年。", "民國37年。"], ans: "B" },
            { id: 16, q: "憲法增修條文所規定之內容，若與憲法本文規定之內容相衝突者，應如何處理？", opts: ["優先適用憲法本文。", "優先適用憲法增修條文。", "優先順序視情況而定。", "再修改憲法本文內容。"], ans: "B" },
            { id: 17, q: "下列何種概念之涵義範圍最廣？", opts: ["國民。", "公民。", "選民。", "人民。"], ans: "D" },
            { id: 18, q: "形式意義憲法的概念，何項正確？", opts: ["具體以條文集成的憲法典。", "所有實質意義憲法應納入形式意義憲法中。", "形式意義憲法之制定修改大多與法律相同。", "形式意義憲法應包括憲法解釋、判例等部分。"], ans: "A" },
            { id: 19, q: "依憲法本文、憲法增修條文以及司法院大法官之解釋，有關憲法之修改，下列何者不正確？", opts: ["僅得依憲法規定的修憲程序修憲。", "只要依修憲程序，憲法中的任何內容都可修改。", "憲法增修條文與憲法本文屬於同等位階。", "修憲應依照公開透明之原則。"], ans: "B" },
            { id: 20, q: "剛性憲法與柔性憲法的主要區別點為：", opts: ["是否具備單一法典。", "憲法修改難易之程度。", "制定憲法的來源力量。", "憲法是否具有拘束力。"], ans: "B" },
            { id: 21, q: "外國人在我國無法享有下列那一項人權？", opts: ["言論自由。", "參政權。", "財產權。", "人身自由權。"], ans: "B" },
            { id: 22, q: "依憲法規定，命令除牴觸憲法外，亦將因牴觸下列何種法規範無效？", opts: ["行政規則。", "自治規則。", "法律。", "別無其他法規範。"], ans: "C" },
            { id: 23, q: "下列何者著有《法意》一書，將國家權力分為行政、立法與司法三種型式？", opts: ["孟德斯鳩。", "洛克。", "盧梭。", "林肯。"], ans: "A" },
            { id: 24, q: "對同一行政院院長，立法院於下列何種情況，不得在一年內提不信任案？", opts: ["行政院院長新就任。", "對行政院院長不信任案未獲通過。", "立法院經總統解散後改選。", "總統新就任。"], ans: "B" },
            { id: 25, q: "立法委員在院內所為之言論及表決，對院外不負責任，但不能免除下列何種責任？", opts: ["刑事追訴。", "民事賠償。", "行政罰。", "選民罷免。"], ans: "D" },
            { id: 26, q: "我國憲法的前言說明我國憲法制定的機關是？", opts: ["立法院。", "大法官會議。", "國民大會。", "監察院。"], ans: "C" },
            { id: 27, q: "下列有關我國總統選舉之敘述何者為非？", opts: ["任期四年。", "連選得連任一次。", "候選人最少要滿45歲。", "聯名登記參選。"], ans: "C" },
            { id: 28, q: "下列何者非總統解散立法院之前提？", opts: ["徵詢立法院長。", "立法院通過對行政院長之不信任案。", "非緊急命令或戒嚴期間。", "選區選民過半同意。"], ans: "D" },
            { id: 29, q: "立法委員除現行犯外，非經立法院許可，不得逮捕拘禁，但以下列何者為限？", opts: ["立法院會場內。", "立法院會期中。", "立法委員任期內。", "立法委員當選後。"], ans: "B" },

            { id: 116, q: "下列何國之行政首長及各部部長不能出席議會答辯並提法案？", opts: ["我國。", "英國。", "美國。", "法國。"], ans: "C" },

            { id: 118, q: "立法院對行政院院長提出之不信任案，如經全體立法委員多少比例以上贊成，行政院院長應於十日內提出辭職？", opts: ["二分之一。", "三分之二。", "四分之三。", "五分之三。"], ans: "A" },
            { id: 119, q: "依憲法第七十三條規定，立法委員在院內所為之言論及表決，對院外不負責任。此不負責任之內容不包括下列何項？", opts: ["民事上責任。", "刑事上責任。", "行政責任。", "政治責任。"], ans: "D" },
            { id: 120, q: "立法委員連選得連任，其選舉於每屆任滿前幾個月內完成之？", opts: ["一。", "二。", "三。", "四。"], ans: "C" },
            { id: 121, q: "立法委員之罷免，得由原選舉區選舉人向選舉委員會提出罷免案；但就職未滿多久者不得罷免？", opts: ["四個月。", "六個月。", "八個月。", "一年。"], ans: "D" },

            { id: 138, q: "我國副總統缺位時，應如何處理？", opts: ["由自由地區選舉人補選之。", "由總統提名，召集國民大會補選之。", "由行政院長代理之。", "由總統提名，經立法院補選之。"], ans: "D" },

            { id: 141, q: "屏東縣政府就屏東縣之自治事項訂定自治法規，並發布者，依地方制度法之規定，其性質為何？", opts: ["自治條例。", "自治規則。", "自律規則。", "委辦規則。"], ans: "B" },
            { id: 142, q: "人民因犯罪嫌疑被逮捕拘禁時，其逮捕拘禁機關應至遲於多長期限內移送該管法院審問？", opts: ["二十四小時。", "三十六小時。", "四十八小時。", "七十二小時。"], ans: "A" },

            { id: 144, q: "我國憲法對於下列何者未規定其應超出黨派獨立行使職權？", opts: ["法官。", "考試委員。", "監察委員。", "行政院政務委員。"], ans: "D" },
            { id: 145, q: "我國憲法規定國民經濟應以何者為基本原則？", opts: ["民生主義。", "資本主義。", "自由主義。", "民主社會主義。"], ans: "A" },
            { id: 146, q: "下列何項不是人民司法上受益權之內涵？", opts: ["訴願權。", "刑事訴訟權。", "選舉訴訟權。", "民事訴訟權。"], ans: "A" },

            { id: 149, q: "我國當初制定憲法之目的不包括：", opts: ["鞏固國權。", "族群融合。", "增進人民福利。", "保障民權。"], ans: "B" },

            { id: 151, q: "下列何者不屬於總統之職權？", opts: ["外交權，包含締結條約及宣戰媾和之權。", "發布緊急命令權。", "人事權，包含任命立法院院長之權。", "赦免權，包含大赦、特赦、減刑及復權之權。"], ans: "C" },
            { id: 152, q: "依憲法增修條文第2條及第4條之規定，總統、副總統之彈劾，何者正確？", opts: ["由監察委員三分之二提案。", "提經立法委員四分之三通過即可。", "經由公投投票，過半數同意後解職。", "由司法院大法官審理，憲法法庭判決成立時，即解職。"], ans: "D" },
            { id: 153, q: "行政院應如何處理司法概算？", opts: ["於會計年度開始前3個月編列。", "得加註意見。", "得刪減數額於行政院院會中審議。", "以上皆是。"], ans: "B" },
            { id: 154, q: "各級法院之法官於審理案件時，對於應適用之法律，依其合理之確信，認為有牴觸憲法之疑義者，應如何處理？", opts: ["無法拒絕適用，只能依據違憲之法律逕行判決。", "得直接拒絕適用，並宣告所應適用之法律係屬違憲。", "雖得拒絕適用，但無法宣告所應適用之法律系屬違憲。", "應裁定停止訴訟程序，聲請司法院大法官解釋。"], ans: "D" },
            { id: 155, q: "有關法官的職務，以下何者屬於行政職，因此不在憲法規定之法官職務保障的範圍內？", opts: ["庭長。", "審判長。", "陪席法官。", "受任法官。"], ans: "A" },
            { id: 156, q: "依憲法增修條文第4條規定，下列何者有權提案變更我國領土？", opts: ["我國自由地區選舉人。", "立法院。", "總統。", "行政院。"], ans: "B" },
            { id: 157, q: "依憲法增修條文第2條之規定，立法院於下列何種期間內，不可能被解散？", opts: ["立法院休會。", "緊急命令生效。", "國家財政危機。", "外來武力威脅。"], ans: "B" },
            { id: 158, q: "下列何者與國史館隸屬同一機關？", opts: ["審計部。", "中央研究院。", "行政院文化建設委員會。", "公務人員保障暨培訓委員會。"], ans: "B" },
            { id: 159, q: "對於公務人員之官等、職等之基本身分事項加以審定，屬下列何者？", opts: ["考試。", "任用。", "銓敘。", "考績。"], ans: "C" },
            { id: 160, q: "關於憲法前言及憲法增修條文前言，下列敘述何者正確？", opts: ["憲法之前言因憲法增修條文前言而暫時停止適用。", "兩者之效力與後續各條文之規範效力相同。", "其所揭示之內容均具本質重要性，乃現行憲法所賴以存立之基礎，即使透過修憲亦不得變更。", "兩者皆係由國民大會所制定。"], ans: "D" },
            { id: 161, q: "關於憲法及憲法增修條文明定應給予特別保障與扶助之對象，不包括下列何者？", opts: ["藝術工作者。", "學行俱優無力升學之學生。", "軍人。", "政黨。"], ans: "D" },
            { id: 162, q: "依司法院釋字第329號解釋，下列有關條約之敘述，何者正確？", opts: ["我國與其他國家所締結之任何國際書面協定，均應送立法院審議。", "我國與國際組織所締結之任何國際書面協定，均應送立法院審議。", "未附有批准條款之國際書面協定，即不須送立法院審議。", "國際書面協定之內容如與國內法律相同，則不須送立法院審議。"], ans: "D" },
            { id: 163, q: "依司法院大法官解釋意旨，下列何者不受憲法表意自由之保障？", opts: ["於網路上對不特定人散布促使人為性交易的訊息。", "於網路上刊登化粧品廣告。", "網友未經主管機關許可，於公共場所緊急舉行集會遊行。", "對他人可受公評且確信其為真實之事項，所為不利之事實陳述。"], ans: "A" },
            { id: 164, q: "依司法院大法官解釋，下列何者受憲法絕對保障，不得限制？", opts: ["生命權。", "思想自由。", "言論自由。", "財產權。"], ans: "B" },
            { id: 165, q: "依司法院釋字第613號解釋及憲法規定，下列敘述何者正確？", opts: ["行政一體旨在使行政院掌理之事務，最終仍受總統之指揮監督。", "行政院毋須為獨立行政機關之整體施政表現負責。", "層級式行政體制之金字塔頂端為行政院。", "總統府為當前國家最高行政機關。"], ans: "C" },
            { id: 166, q: "司法院釋字第690號解釋，係對於傳染病防治法中關於必要處置及強制隔離規定所為之違憲審查。下列何者，並非上述解釋所引用之原則？", opts: ["比例原則。", "信賴保護原則。", "法律明確性原則。", "正當法律程序原則。"], ans: "B" },

            { id: 168, q: "依憲法增修條文規定，監察院不再行使下列何種職權？", opts: ["糾舉權。", "糾正權。", "同意權。", "審計權。"], ans: "C" },

            { id: 170, q: "下列何者不是司法院之權限？", opts: ["公務員懲戒。", "犯罪偵查。", "統一解釋法律命令。", "解釋憲法。"], ans: "B" },
            { id: 171, q: "依據憲法規定，下列何者並非專屬中央立法並執行，且不得交由地方執行之事項？", opts: ["電政。", "司法制度。", "教育制度。", "商事法律。"], ans: "C" },
            { id: 172, q: "關於立法院通過，總統公布之法規範，下列敘述何者正確？", opts: ["皆為公法。", "為形式意義之法律。", "無須經行政院院長之副署。", "得以「規則」為其名稱。"], ans: "B" },
            { id: 173, q: "下列何者非屬法院適用法律必須遵循之原則？", opts: ["上下命令服從之原則。", "不告不理原則。", "獨立審判原則。", "一事不再理原則。"], ans: "A" },
            { id: 174, q: "依司法院釋字第666號解釋意旨，對於從事性交易之行為人，僅處罰意圖得利之一方，而不處罰支付對價之相對人，係違反下列何者？", opts: ["平等原則。", "比例原則。", "信賴保護原則。", "公益原則。"], ans: "A" },
            { id: 175, q: "下列何者非屬信賴保護原則之要件？", opts: ["信賴基礎。", "信賴表現。", "值得保護之信賴利益。", "信賴利益應大過於公共利益。"], ans: "D" },

            { id: 177, q: "下列何者並非依公務員懲戒法，得對公務員實施的懲戒處分？", opts: ["撤職。", "休職。", "申誡。", "命公開道歉。"], ans: "D" },
            { id: 178, q: "有關普通法系的敘述，下列何者錯誤？", opts: ["主要以判例作為法源。", "區別民事法院及行政法院。", "區分普通法院與衡平法院。", "通常無契約法之成文法典。"], ans: "B" },
            { id: 179, q: "民間常見以他人名義進行財產登記，但約定由本人保有對該財產之事實上管理、使用、收益、處分等權限，民法對此種「借名登記」契約並無明文規定。法院認為此種契約與民法規定之「委任」契約相近，因此適用民法有關委任的規定。這是運用何種解釋方法？", opts: ["類推適用。", "反面推論。", "舉輕明重。", "體系解釋。"], ans: "A" },
            { id: 180, q: "職業軍人公然侮辱長官時，可能同時構成刑法的公然侮辱罪和陸海空軍刑法的公然侮辱長官罪，如認應優先適用陸海空軍刑法之規定，此種法律適用原則稱為：", opts: ["類推適用。", "特別法優於普通法。", "後法優於前法。", "從新從輕原則。"], ans: "B" },
            { id: 181, q: "關於我國法律之制定與施行，下列敘述何者錯誤？", opts: ["憲法所稱之法律，指立法院三讀通過，經總統公布者。", "司法院掌理具體案件之裁判，無法律案之提案權。", "法律之公布，須經行政院院長及有關部會首長之副署。", "考試院職司考試事項，就執掌內之事項，有法律案之提案權。"], ans: "B" },
            { id: 182, q: "依司法院大法官解釋意旨，下列何者非屬「憲法部分條文之規範內容具有本質之重要性，而為規範秩序存立之基礎」者？", opts: ["有關權力分立與制衡原則之規定。", "有關人民基本權利保障之規定。", "有關國民主權原則之規定。", "有關國旗之規定。"], ans: "D" },
            { id: 183, q: "依司法院大法官解釋意旨，立法院如於特殊例外情形，授權立法委員以外之人員代為行使調查權，仍負有監督受委任人員履行職務之義務，此係下列何種原則之展現？", opts: ["授權明確性原則。", "法律保留原則。", "憲法機關忠誠原則。", "民意政治及責任政治原則。"], ans: "D" },
            { id: 184, q: "憲法第13條保障人民有信仰宗教之自由，依司法院大法官解釋意旨，下列關於信仰宗教自由之敘述，何者錯誤？", opts: ["人民不信仰任何宗教，此一信念亦受信仰宗教自由之保障。", "人民對國家應盡之基本義務，不得僅因信仰宗教之關係而免除。", "信仰宗教自由僅自然人能享有，故國家對宗教團體之財產處分行為予以管制，不涉及信仰宗教自由之限制。", "國家不得對特定之宗教加以獎勵或禁制。"], ans: "C" },
            { id: 185, q: "行政機關對人民作成違法授益行政處分後，若不得撤銷該處分，係基於下列何種原則之考量？", opts: ["信賴保護原則。", "不當聯結禁止原則。", "誠實信用原則。", "行政自我拘束原則。"], ans: "A" },
            { id: 186, q: "有關行政法基本原則之敘述，下列何者正確？", opts: ["民法、刑法之基本法律原則，對行政法亦應一體適用。", "行政法領域中，公共利益必然優先於私人利益。", "行政程序法施行前，無信賴保護原則之適用。", "行政行為應權衡所欲保護之公益及可能侵害之人民權益。"], ans: "D" },
            { id: 187, q: "關於比例原則之敘述，下列何者錯誤？", opts: ["行政機關有多種方法可以達成行政目的時，得依職權採取其中任一方法。", "行政機關必須採取有助於達成目的之方法。", "行政機關應衡量採取之方法，對於人民權益是否侵害過大。", "行政機關採取之方法，對人民造成之損害，不得與欲達成目的之利益顯失均衡。"], ans: "A" },
            { id: 188, q: "地方自治團體制定之自治法規，不得牴觸國家法律，係基於下列何種原則？", opts: ["法律保留原則。", "國家主權原則。", "法律優位原則。", "中央與地方均權原則。"], ans: "C" },
            { id: 189, q: "甲公司申請外籍勞工，主管機關予以許可，但要求須贊助特定道路拓寬工程經費，可能違反下列何者？", opts: ["信賴保護原則。", "明確性原則。", "不當聯結禁止原則。", "比例原則。"], ans: "C" },
            { id: 190, q: "下列何者非屬公務員懲戒之事由？", opts: ["違法執行職務。", "取得雙重國籍。", "怠為執行職務。", "其他失職行為。"], ans: "B" },
            { id: 191, q: "依法任用之公務人員為違法行為可能負擔之責任，不包括下列何者？", opts: ["民事損害賠償責任。", "刑事責任。", "行政懲戒責任。", "政治辭職責任。"], ans: "D" },
            { id: 192, q: "依國家賠償法規定，關於「受委託行使公權力之個人，於執行職務不法侵害人民權利」之敘述，下列何者錯誤？", opts: ["該個人行使公權力有故意或重大過失時，賠償義務機關始負國家賠償責任。", "以委託機關為賠償義務機關。", "該個人行使公權力時，視同委託機關之公務員。", "該個人行使公權力有故意時，賠償義務機關對其有求償權。"], ans: "A" },
            { id: 193, q: "我國目前行政訴訟採取何種審級救濟制度？", opts: ["三級二審。", "三級三審。", "二級二審。", "四級三審。"], ans: "A" },
            { id: 194, q: "依照消除對婦女一切形式歧視公約施行法，公約中涉及性別人權之規定，具有何種法效？", opts: ["國際法。", "國際習慣法。", "條約。", "國內法律。"], ans: "D" },
            { id: 195, q: "依國際慣例，下列何者於停留我國時，不享有刑事豁免權？", opts: ["無國籍者。", "外國元首。", "外國之使節。", "經我國承認而停泊之外國軍艦及其因公登陸之軍隊。"], ans: "A" },
            { id: 196, q: "若海關允許旅客攜帶1公升之威士忌入關，則當然允許攜帶半公升之威士忌入關，此為：", opts: ["類推適用。", "反面解釋。", "舉重以明輕之解釋。", "歷史解釋。"], ans: "C" },
            { id: 197, q: "解釋法律條文時，不僅考量該條文本身之規定，並進一步從其他相關規定，或與其他法律之關係來解釋法律，這種解釋是運用何種解釋方法？", opts: ["目的解釋。", "合憲性解釋。", "歷史解釋。", "體系解釋。"], ans: "D" },
            { id: 198, q: "依中央法規標準法之規定，法規命令不因下列何者而廢止？", opts: ["機關裁併，有關法規命令無保留之必要。", "法規規定事項已執行完畢，無繼續施行之必要。", "同一事項已定有新法規，並發布施行者。", "法規命令經法官於個案審判中認定為違法者。"], ans: "D" },
            { id: 199, q: "依中央法規標準法之規定，下列何者無須以法律定之？", opts: ["關於人民之權利、義務者。", "關於學生助學貸款事項者。", "關於國家各機關之組織者。", "憲法明文規定，應以法律定之者。"], ans: "B" },
            { id: 200, q: "下列何者非屬行政機關發布之命令？", opts: ["離島建設條例施行細則。", "地方稅法通則。", "採購人員倫理準則。", "土地登記規則。"], ans: "B" },
            { id: 201, q: "依憲法第108條規定，有關「全國戶口調查及統計」事項，係：", opts: ["由中央立法並執行之。", "由中央立法並執行之，或交由省縣執行之。", "由省立法並執行之。", "由省立法並執行之，或交由縣執行之。"], ans: "B" },
            { id: 202, q: "以美國聯邦法院判決為例，國家均應保障人民有最大限度的言論空間，然下列何者除外？", opts: ["涉煽惑仇恨。", "種族歧視。", "散播淫穢。", "以上均是。"], ans: "D" },
            { id: 203, q: "下列何者非1215年的英國「大憲章」(Magna Carta / Grand Charter)的要旨？", opts: ["強調英王要徵稅，須先經貴族院同意。", "非經法院判決，不得禁錮或罰金。", "「大憲章」是歷史上第一個國王與一般人民所定的契約。", "限制王權，確立法律優位之精神。"], ans: "C" },
            { id: 204, q: "大法官釋字718號認為集會遊行法第8條第1項規定，室外集會、遊行應向主管機關申請許可，未排除緊急性及偶發性集會、遊行部分，及同法第9條第1項但書與第12條第2項關於緊急性集會、遊行之申請許可規定，違反憲法何種精神，而違憲？", opts: ["比例原則。", "平等原則。", "法律明確性原則。", "信賴保護原則。"], ans: "A" },
            { id: 205, q: "大法官釋字644號指明，人民團體法規定：「人民團體之組織與活動，不得主張共產主義或主張分裂國土。」否則不得集會與結社之規定者，顯已逾越必要之程度，與憲法保障人民結社自由與言論自由之意旨不符，係指人團法違背憲法的何種精神？", opts: ["平等原則。", "比例原則。", "法律明確性原則。", "信賴保護原則。"], ans: "B" },
            { id: 206, q: "依公務人員懲戒法，下列何種懲戒以書面為之？", opts: ["減俸。", "休職。", "申誡。", "降級。"], ans: "C" },
            { id: 207, q: "依公務人員懲戒法，減俸的期限？", opts: ["1個月到6個月。", "3個月到1年。", "6個月到2年。", "6個月到3年。"], ans: "D" },
            { id: 208, q: "下列何者非屬大法官釋字499號所稱的「自由民主憲政秩序」？", opts: ["民主共和國原則。", "國民主權。", "保障人民權利。", "總統直接民選。"], ans: "D" },
            { id: 209, q: "1948年我國動員戡亂時期臨時條款的制定主要是開放總統何權限？", opts: ["不受連任之限制。", "設立動員戡亂機構。", "緊急權。", "遴選海外僑選立法委員。"], ans: "C" },
            { id: 210, q: "大法官釋字530號認為下列何者乃屬於自由民主憲政秩序權力分立與制衡之重要原則？", opts: ["平等精神。", "審判獨立。", "人權保障。", "比例原則。"], ans: "B" },
            { id: 211, q: "我國憲法雖訂於20世紀，然並無社會權之明文，但我憲法中那些規定亦屬社會權之範疇？", opts: ["教育權。", "生存權。", "工作權。", "以上均是。"], ans: "D" },
            { id: 212, q: "大法官解釋認為監察院與司法院也應該與立法院一樣有法律提案權的解釋思惟是：", opts: ["文理解釋。", "類推解釋。", "歷史解釋。", "立法解釋。"], ans: "B" },
            { id: 213, q: "2020年監察院成立了「國家人權委員會」，進一步宣示我國對人權保障的決心，是呼應下列那一個相關的國際人權文件的措施？", opts: ["1933年的「蒙特維多國際公約」。", "1993年的「巴黎原則（巴黎宣言）」。", "1948年的「世界人權宣言」。", "1951年的「舊金山和約」。"], ans: "B" },
            { id: 214, q: "依地方制度法，自治法規之相關規定，下列何者錯誤？", opts: ["直轄市議會通過的自治條例稱為「某直轄市法規」。", "縣(市)議會通過的自治條例稱為「某縣(市)規章」。", "違反地方自治團體自治事項之行政罰鍰最高罰20萬台幣。", "鄉(鎮、市)自治規則，除法律或基於法律授權之法規另有規定外，應於發布後送縣政府備查。"], ans: "C" },
            { id: 215, q: "依地方制度法的規定，要成為直轄市之人口數至少要達到多少人口？", opts: ["100萬。", "125萬。", "150萬。", "200萬。"], ans: "B" },
            { id: 216, q: "下列何者非為地方自治團體？", opts: ["南投市。", "潭子區。", "草屯鎮。", "長治鄉。"], ans: "B" },
            { id: 217, q: "依總統府組織法之規定有關資政、國策顧問與戰略顧問之敘述何者為非？", opts: ["國策顧問人數比資政多。", "戰略顧問人數最少。", "資政為有給職。", "國策顧問為無給職。"], ans: "C" },
            { id: 218, q: "依中央法規標準法之規定下列何者有誤？", opts: ["法規明定自公布或發布日施行者，自公布或發布之日起算第三日發生效力。", "法律應經立法院通過，總統公布始生效力。", "法律之廢止亦要經立法院通過廢止，然僅由立法院長公告周知即行。", "「省縣自治通則」之屬性乃法律非命令。"], ans: "C" },
            { id: 219, q: "下列何者非公職人員選舉罷免法所稱之公職？", opts: ["台北市長。", "彰化縣長。", "草屯鎮鎮民代表。", "大里區長。"], ans: "D" },
            { id: 220, q: "依我國國家賠償法之規定，下列何者有誤？", opts: ["除國家賠償法之規定外，亦適用民法之規定。", "申請國家賠償之請求權，自請求人知有損害起二年間不行使而消滅。", "若請求人原不知權益受損，經過五年後，亦無法申請國家賠償。", "外國人在我國權益受損，除了時效之規定外，應視其在我國居留期間是否遵守我國家法令以為斷。"], ans: "D" },
            { id: 221, q: "我國憲法有關選舉權的行使的規定，下列何者錯誤？", opts: ["滿20歲才可以行使選舉權與行使公民投票權。", "至少要滿23歲才可以當候選人。", "選舉如果發生紛爭之選舉訴訟則由法院處理。", "被選舉人得由原選區依法罷免之。"], ans: "A" },
            { id: 222, q: "有關我國憲法與相關法律之規定，有關總統相關之論述，何者有誤？", opts: ["副總統缺位時，由行政院代行其職至其任期屆滿之日止。", "總統、副總統任期為四年，連選得連任一次。", "總統、副總統之罷免案，須先經由立法委員總額四分之一以上之提議。", "立法委員總額三分之二同意可最終提出總統、副總統彈劾案。"], ans: "A" },
            { id: 223, q: "依憲法規定下列敘述何者錯誤？", opts: ["行政院不管部會之政務委員，由行政院長提請立法委員同意任命。", "行政院於會計年度開始三個月前，應將下年度預算案，提出於立法院。", "立法院對於行政院移請之覆議案，應於送達十五日內作為決議。", "立法院得經全體立法委員三分之一以上連署，對行政院院長提不信任案。"], ans: "A" },
            { id: 224, q: "對我憲法總綱與前言之敘述，以下何者為誤？", opts: ["所謂中華民國國民者，是指具有中華民國國籍者。", "中華民國領土，依其固有之疆域，最後非經國民公投通過不得變更之。", "中華民國基於三民主義，為民有、民治、民享之民主共和國。", "中華民國國都雖明訂於南京，但現行首都是台北。"], ans: "D" },
            { id: 225, q: "依憲法有關立法院的敘述下列何者有誤？", opts: ["立法委員由人民直接選舉之，代表人民行使立法權。", "立法院會期每年二次，由總統召集之。", "每年四月與十一月屬於憲法法定開會期間。", "立法委員之任期為四年。"], ans: "B" },
            { id: 226, q: "依我憲法有關司法院之規定，何者錯誤？", opts: ["法官為終身職，非受刑事或懲戒處分，或禁治產之宣告，不得停職，轉任或減俸。", "司法院解釋憲法，並有統一解釋法律及命令之權。", "依憲法目前司法院設大法官15人。", "司法院所提之年度司法概算，行政院不得刪減。"], ans: "A" },
            { id: 227, q: "我國憲法有關考試院之相關規定何者為誤？", opts: ["考試院長副院長本身不一定要具備考試委員之資格。", "公務人員之銓敘、保障、撫卹、退休事項，歸行政院人事總處負責。", "原憲法本文考試院職掌中，養老部份已不在增修條文內明訂。", "考試院關於所掌事項，得向立法院提出法律案。"], ans: "B" },
            { id: 228, q: "憲法有關監察院之相關敘述，何者錯誤？", opts: ["依增修條文之規定，監察院為國家最高監察機關，行使同意、彈劾、糾舉及審計權。", "監察委員二十九人，院長及副院長同時也是監察委員。", "監察院對中央、地方公務人員之彈劾案，須先經由監察委員二人以上之提議。", "監察委員須超出黨派以外，依據法律獨立行使職權。"], ans: "A" },

            { id: 230, q: "有關憲法基本國策之相關規定，下列敘述何者錯誤？", opts: ["現役軍人不得兼任文官。", "國民受教育機會一律平等。", "依憲法本文規定，國家為增進民族健康，應普遍推行全民健康保險。", "國內私人經營之教育事業，成績優良者，國家可予以獎勵或補助。"], ans: "C" },
            { id: 231, q: "有關憲法基本國策之相關規定，下列敘述何者錯誤？", opts: ["中華民國領域內，一切貨物應許自由流通。", "國家肯定多元文化，並積極維護發展原住民族語言及文化。", "教育、科學、文化之經費，尤其國民教育之經費應優先編列，不受憲法第164條之限制。", "六歲至十八年之學齡兒童，一律受基本教育，免學費，其貧苦由政府供給書籍。"], ans: "D" },
            { id: 232, q: "憲法有關中央與地方之敘述，何者錯誤？", opts: ["省法規與國家法律有無牴觸發生疑義時，由立法院議定之。", "屬縣之立法權由縣議會行之。", "省政府承行政院之命，監督縣自治事項。", "我國目前有六個直轄市。"], ans: "A" },
            { id: 233, q: "憲法有關監察院之相關敘述，何者錯誤？", opts: ["審計長由總統提名，經立法院同意任命。", "現在監察委員已不再具備言論免責權了。", "審計部應於收到行政院提決算後三個月內，依法完成審核。", "審計長本身也是監察委員之一。"], ans: "D" },
            { id: 234, q: "憲法有關提名權與同意權的行使，何者錯誤？", opts: ["監察院對總統提名的人選已經沒有同意權了。", "總統提名審計長與大法官須經立法院同意後才能任命。", "總統任命行政院長之前提是要經過立法院的同意。", "考試院長與考試委員都要先經過總統提名，再經過立法院同意後才能任命。"], ans: "C" },
            { id: 235, q: "依憲法與相關法律有關監察院之相關敘述，何者錯誤？", opts: ["審計長由總統提名，經立法院同意任命。", "現在監察委員已不再具有言論免責權了。", "審計部應於收到行政院所提決算後四個月內，依法完成審核。", "監察院設國家人權委員會。"], ans: "C" },
            { id: 236, q: "依憲法與相關法律有關立法院的敘述下列何者有誤？", opts: ["立法院經總統解散後，在新選出之立法委員就職前，視同休會。", "立法院可向監察院提出總統、副總統之彈劾案。", "立法委員，除現行犯外，在會期中，非經立法院之許可不得逮捕或拘禁。", "立法委員不得兼任官吏。"], ans: "B" },
            { id: 237, q: "我國憲法有關考試院之相關規定何者為誤？", opts: ["公務人員任用資格與專門職業及技術人員之執業資格應經考試院依法考選銓定之。", "考試委員須超出黨派以外，依法律獨立行使職權。", "依考試院組織法置考試委員5-7人。", "考試委員乃由總統提名再經立法院同意後才任命。"], ans: "C" },
            { id: 238, q: "依憲法有關司法院之規定，何者錯誤？", opts: ["擔任司法院正副院長之大法官，其任期不一定是八年。", "司法院為國家最高司法機關，掌理民事、刑事、行政訴訟之審判及公務人員之懲戒。", "司法院長由總統提名，立法委員同意後任命。", "司法院院長本身不一定是大法官。"], ans: "D" },
            { id: 239, q: "憲法有關選舉權的行使，下列何者錯誤？", opts: ["副總統出缺時由立法委員選舉之。", "增修條文特增職業團體代表，以保障各行各業之參政權。", "總統、副總統由中華民國自由地區全體人民直接選舉之。", "以普通、平等、直接與無記名投票之方法行之。"], ans: "B" },
            { id: 240, q: "我國憲法有關總統副總統之規定，下列何者有誤？", opts: ["中華民國國民年滿四十歲者，得被選為總統副總統。", "只有總統有權力發布宣布戒嚴。", "基於主權在民原則總統任命行政院長之前要得到立法院的同意。", "總統對外代表國家。"], ans: "C" },
            { id: 241, q: "依憲法有關司法院之規定，何者錯誤？", opts: ["擔任司法院正副院長之大法官，其任期不一定是八年。", "司法院為國家最高司法機關，掌理民事、刑事、行政訴訟之審判及公務人員之懲戒。", "政黨是否違憲，要不要解散屬司法院的職權。", "總統宣布戒嚴最終要經司法院的同意。"], ans: "D" },
            { id: 242, q: "依憲法下列敘述何者錯誤？", opts: ["立法院可向司法院提出總統、副總統之彈劾案。", "立法委員，除現行犯外，在會期中，非經立法院之許可不得逮捕或拘禁。", "總統要解散立法院須先諮詢立法院長。", "要變更國家領土，首先要由立法院提案，然後經大法官同意才能成立。"], ans: "D" },
            { id: 243, q: "依我國憲法下列敘述何者錯誤？", opts: ["法務部長由總統直接任命之。", "行政院為國家最高行政機關。", "行政院長現由總統直接任命無須任何民意機關同意。", "行政院副院長由院長提請總統任命之。"], ans: "A" },
            { id: 244, q: "依我國憲法下列敘述何者錯誤？", opts: ["中華民國之主權屬於國民全體。", "憲法之制定機關是國民大會。", "我國憲法乃依據孫文遺教所訂立。", "我國憲法是屬於成文憲法。"], ans: "B" }, // 註：依PDF題庫第244題原標示答案為(B)
            { id: 245, q: "依我國憲法有關基本國策之相關規定，下列敘述何者錯誤？", opts: ["公用事業及其它獨佔事業，以公營為原則，其經法律許可者，得由國民經營之。", "中華民國之國防以保衛國家安全，維護世界和平為目的。", "國民經濟應以自由經濟為基本原則，實施平均地權，節制資本，以謀國計民生之均足。", "現役軍人不得兼任文官。"], ans: "C" }
        ];

        // 應用程式狀態
        let state = {
            mode: 'practice', // 'practice' | 'wrong-practice' | 'wrong-list'
            isRandom: false,
            currentIndex: 0,
            questionOrder: [], // 儲存當前模式的題目 ID 陣列
            history: {}, // { [questionId]: { selected: 'A', isCorrect: true, wrongCount: 1 } }
            wrongSet: new Set() // 儲存目前在錯題本中的題目 ID
        };

        const STORAGE_KEY = 'roc_constitution_quiz_state_v1';
        const optionLetters = ['A', 'B', 'C', 'D'];

        // 初始化
        function init() {
            loadState();
            buildQuestionOrder();
            updateStatsUI();
            renderCurrentView();
        }

        // 讀取本地儲存進度
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.history = parsed.history || {};
                    state.wrongSet = new Set(parsed.wrongList || []);
                    state.isRandom = !!parsed.isRandom;
                    document.getElementById('toggle-random').checked = state.isRandom;
                }
            } catch (e) {
                console.error("讀取紀錄失敗", e);
            }
        }

        // 儲存進度到本地
        function saveState() {
            try {
                const toSave = {
                    history: state.history,
                    wrongList: Array.from(state.wrongSet),
                    isRandom: state.isRandom
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
            } catch (e) {
                console.error("儲存紀錄失敗", e);
            }
        }

        // 建立出題順序
        function buildQuestionOrder() {
            let ids = [];
            if (state.mode === 'wrong-practice') {
                ids = Array.from(state.wrongSet).sort((a, b) => a - b);
            } else {
                ids = rawQuestions.map(q => q.id);
            }

            if (state.isRandom && ids.length > 1) {
                // Fisher-Yates 洗牌演算法
                for (let i = ids.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ids[i], ids[j]] = [ids[j], ids[i]];
                }
            }
            state.questionOrder = ids;
            state.currentIndex = 0;
        }

        // 切換分頁模式
        function switchTab(newMode) {
            state.mode = newMode;

            // 更新 Tab 樣式
            ['practice', 'wrong-practice', 'wrong-list'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === newMode) {
                    btn.className = "px-3 py-1.5 rounded-md font-medium transition bg-white text-indigo-700 shadow-sm flex items-center";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md font-medium transition text-indigo-100 hover:text-white flex items-center";
                }
            });

            if (newMode === 'practice' || newMode === 'wrong-practice') {
                buildQuestionOrder();
            }
            renderCurrentView();
        }

        // 切換隨機模式
        function toggleRandomMode() {
            state.isRandom = document.getElementById('toggle-random').checked;
            saveState();
            if (state.mode === 'practice' || state.mode === 'wrong-practice') {
                buildQuestionOrder();
                renderQuizCard();
            }
        }

        // 渲染當前視圖
        function renderCurrentView() {
            const viewQuiz = document.getElementById('view-quiz');
            const viewWrongList = document.getElementById('view-wrong-list');

            if (state.mode === 'wrong-list') {
                viewQuiz.classList.add('hidden');
                viewWrongList.classList.remove('hidden');
                renderWrongList();
            } else {
                viewWrongList.classList.add('hidden');
                viewQuiz.classList.remove('hidden');
                renderQuizCard();
            }
        }

        // 渲染刷題卡片
        function renderQuizCard() {
            const emptyState = document.getElementById('empty-wrong-state');
            const quizCard = document.getElementById('quiz-card');

            if (state.questionOrder.length === 0) {
                emptyState.classList.remove('hidden');
                quizCard.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            quizCard.classList.remove('hidden');

            const qId = state.questionOrder[state.currentIndex];
            const qObj = rawQuestions.find(item => item.id === qId);
            const record = state.history[qId];

            // 標籤與題號顯示
            const modeTag = document.getElementById('q-mode-tag');
            if (state.mode === 'wrong-practice') {
                modeTag.textContent = '錯題專練模式';
                modeTag.className = 'text-xs font-bold px-2.5 py-1 rounded bg-rose-100 text-rose-700';
            } else {
                modeTag.textContent = state.isRandom ? '全部題庫 (隨機)' : '全部題庫 (順序)';
                modeTag.className = 'text-xs font-bold px-2.5 py-1 rounded bg-indigo-100 text-indigo-700';
            }

            document.getElementById('q-number').textContent = qObj.id;
            document.getElementById('q-progress-text').textContent = `(本輪進度 ${state.currentIndex + 1} / ${state.questionOrder.length})`;
            document.getElementById('q-text').textContent = qObj.q;

            // 顯示或隱藏「移出錯題」按鈕
            const btnRemoveWrong = document.getElementById('btn-remove-wrong');
            if (state.wrongSet.has(qId)) {
                btnRemoveWrong.classList.remove('hidden');
            } else {
                btnRemoveWrong.classList.add('hidden');
            }

            // 渲染選項
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // 在錯題專練模式下，允許重新作答；全部刷題模式下若已作答則顯示紀錄（也可點擊重答）
            const showAnsweredState = (state.mode === 'practice' && record && record.selected);

            qObj.opts.forEach((optText, idx) => {
                const letter = optionLetters[idx];
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => handleSelectOption(letter);
                
                let baseClass = "option-btn w-full text-left p-4 rounded-xl border-2 flex items-start space-x-3 ";
                let badgeClass = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0 ";

                if (showAnsweredState) {
                    if (letter === qObj.ans) {
                        baseClass += "border-emerald-500 bg-emerald-50/70 text-emerald-950";
                        badgeClass += "bg-emerald-500 text-white";
                    } else if (letter === record.selected && letter !== qObj.ans) {
                        baseClass += "border-rose-500 bg-rose-50/70 text-rose-950";
                        badgeClass += "bg-rose-500 text-white";
                    } else {
                        baseClass += "border-slate-200 bg-white text-slate-500 opacity-75";
                        badgeClass += "bg-slate-100 text-slate-500";
                    }
                } else {
                    baseClass += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/30 text-slate-700";
                    badgeClass += "bg-slate-100 text-slate-700";
                }

                btn.className = baseClass;
                btn.innerHTML = `
                    <span class="${badgeClass}">${letter}</span>
                    <span class="pt-0.5 text-base leading-snug">${optText}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            // 處理即時反饋區塊
            const feedbackBox = document.getElementById('feedback-box');
            if (showAnsweredState) {
                renderFeedback(record.selected === qObj.ans, qObj.ans, qObj.opts[optionLetters.indexOf(qObj.ans)]);
            } else {
                feedbackBox.classList.add('hidden');
            }

            // 更新上下題按鈕狀態
            document.getElementById('btn-prev').disabled = state.currentIndex === 0;
            const btnNext = document.getElementById('btn-next');
            if (state.currentIndex === state.questionOrder.length - 1) {
                btnNext.innerHTML = `完成本輪 <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                btnNext.innerHTML = `下一題 <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            }
        }

        // 處理使用者點擊選項 (即時判斷答案)
        function handleSelectOption(selectedLetter) {
            const qId = state.questionOrder[state.currentIndex];
            const qObj = rawQuestions.find(item => item.id === qId);
            const isCorrect = (selectedLetter === qObj.ans);

            // 更新作答歷史
            const prevRecord = state.history[qId] || { wrongCount: 0 };
            state.history[qId] = {
                selected: selectedLetter,
                isCorrect: isCorrect,
                wrongCount: isCorrect ? prevRecord.wrongCount : (prevRecord.wrongCount + 1)
            };

            // 錯題統整邏輯
            if (!isCorrect) {
                state.wrongSet.add(qId);
            }

            saveState();
            updateStatsUI();

            // 立即更新選項按鈕外觀
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                const letter = optionLetters[idx];
                const badge = btn.querySelector('span:first-child');
                
                if (letter === qObj.ans) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border-2 flex items-start space-x-3 border-emerald-500 bg-emerald-50/80 text-emerald-950 font-medium";
                    badge.className = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0 bg-emerald-500 text-white";
                } else if (letter === selectedLetter && !isCorrect) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border-2 flex items-start space-x-3 border-rose-500 bg-rose-50/80 text-rose-950";
                    badge.className = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0 bg-rose-500 text-white";
                } else {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border-2 flex items-start space-x-3 border-slate-200 bg-white text-slate-400 opacity-70";
                    badge.className = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0 bg-slate-100 text-slate-400";
                }
            });

            // 顯示移出錯題按鈕
            const btnRemoveWrong = document.getElementById('btn-remove-wrong');
            if (state.wrongSet.has(qId)) {
                btnRemoveWrong.classList.remove('hidden');
            }

            // 顯示即時反饋
            const correctOptText = qObj.opts[optionLetters.indexOf(qObj.ans)];
            renderFeedback(isCorrect, qObj.ans, correctOptText);

            // 若勾選「答對自動下一題」
            if (isCorrect && document.getElementById('auto-next-correct').checked) {
                setTimeout(() => {
                    if (state.currentIndex < state.questionOrder.length - 1) {
                        nextQuestion();
                    }
                }, 650);
            }
        }

        // 渲染即時反饋提示框
        function renderFeedback(isCorrect, ansLetter, ansText) {
            const box = document.getElementById('feedback-box');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const detail = document.getElementById('feedback-detail');

            box.classList.remove('hidden');

            if (isCorrect) {
                box.className = "mt-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900";
                icon.innerHTML = `<svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                title.textContent = "答對了！";
                detail.textContent = `正確答案是 (${ansLetter}) ${ansText}`;
            } else {
                box.className = "mt-6 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-900";
                icon.innerHTML = `<svg class="w-6 h-6 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                title.textContent = "答錯了！已自動收入「錯題統整本」";
                detail.innerHTML = `正確答案為：<strong class="text-emerald-700">(${ansLetter}) ${ansText}</strong>`;
            }
        }

        // 上一題
        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuizCard();
            }
        }

        // 下一題
        function nextQuestion() {
            if (state.currentIndex < state.questionOrder.length - 1) {
                state.currentIndex++;
                renderQuizCard();
            } else {
                alert("恭喜你已完成本輪所有題目！");
            }
        }

        // 將當前題目移出錯題本
        function removeCurrentFromWrong() {
            const qId = state.questionOrder[state.currentIndex];
            state.wrongSet.delete(qId);
            saveState();
            updateStatsUI();

            if (state.mode === 'wrong-practice') {
                // 在錯題專練模式中移除後，從當前清單剔除並刷新
                state.questionOrder.splice(state.currentIndex, 1);
                if (state.currentIndex >= state.questionOrder.length) {
                    state.currentIndex = Math.max(0, state.questionOrder.length - 1);
                }
                renderQuizCard();
            } else {
                document.getElementById('btn-remove-wrong').classList.add('hidden');
            }
        }

        // 渲染錯題統整本列表
        function renderWrongList() {
            const container = document.getElementById('wrong-list-container');
            const btnStartPractice = document.getElementById('btn-start-wrong-practice');
            container.innerHTML = '';

            const wrongIds = Array.from(state.wrongSet).sort((a, b) => a - b);

            if (wrongIds.length === 0) {
                btnStartPractice.disabled = true;
                btnStartPractice.classList.add('opacity-50', 'cursor-not-allowed');
                container.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-500">
                        目前還沒有任何錯題紀錄。去刷題時只要答錯，題目就會自動整理在這裡！
                    </div>
                `;
                return;
            }

            btnStartPractice.disabled = false;
            btnStartPractice.classList.remove('opacity-50', 'cursor-not-allowed');

            wrongIds.forEach(id => {
                const qObj = rawQuestions.find(item => item.id === id);
                const record = state.history[id] || {};
                const correctIdx = optionLetters.indexOf(qObj.ans);
                const wrongCount = record.wrongCount || 1;

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-xs border border-slate-200 p-5 hover:border-rose-300 transition";
                
                let optionsHtml = qObj.opts.map((opt, idx) => {
                    const letter = optionLetters[idx];
                    const isAns = letter === qObj.ans;
                    const isLastWrong = letter === record.selected && !isAns;
                    
                    let cls = "text-sm py-1.5 px-3 rounded-lg flex items-center ";
                    if (isAns) {
                        cls += "bg-emerald-50 text-emerald-800 font-bold border border-emerald-200";
                    } else if (isLastWrong) {
                        cls += "bg-rose-50 text-rose-700 line-through border border-rose-200";
                    } else {
                        cls += "text-slate-600";
                    }

                    return `<div class="${cls}">
                        <span class="w-6 font-bold">(${letter})</span>
                        <span>${opt}</span>
                        ${isAns ? '<span class="ml-auto text-xs bg-emerald-600 text-white px-2 py-0.5 rounded">正解</span>' : ''}
                        ${isLastWrong ? '<span class="ml-auto text-xs bg-rose-500 text-white px-2 py-0.5 rounded">上次誤選</span>' : ''}
                    </div>`;
                }).join('');

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="bg-slate-800 text-white text-xs font-bold px-2.5 py-1 rounded">第 ${qObj.id} 題</span>
                            <span class="bg-rose-100 text-rose-700 text-xs font-medium px-2 py-0.5 rounded">累計錯 ${wrongCount} 次</span>
                        </div>
                        <button onclick="removeWrongById(${qObj.id})" class="text-xs text-slate-400 hover:text-emerald-600 flex items-center transition">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            標記已熟練並移除
                        </button>
                    </div>
                    <h3 class="font-bold text-slate-800 text-base mb-3 leading-relaxed">${qObj.q}</h3>
                    <div class="space-y-1.5">${optionsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        // 從錯題統整本中單獨移除某題
        function removeWrongById(id) {
            state.wrongSet.delete(id);
            saveState();
            updateStatsUI();
            renderWrongList();
        }

        // 清空錯題本
        function clearAllWrong() {
            if (state.wrongSet.size === 0) return;
            if (confirm("確定要清空所有錯題紀錄嗎？")) {
                state.wrongSet.clear();
                saveState();
                updateStatsUI();
                renderWrongList();
            }
        }

        // 更新頂部統計數字
        function updateStatsUI() {
            const answeredIds = Object.keys(state.history);
            const totalAnswered = answeredIds.length;
            const correctCount = answeredIds.filter(id => state.history[id].isCorrect).length;
            const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
            const wrongCount = state.wrongSet.size;

            document.getElementById('stat-answered').textContent = totalAnswered;
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('badge-wrong-count').textContent = wrongCount;
        }

        // 開啟題號跳轉視窗
        function openJumpModal() {
            const modal = document.getElementById('jump-modal');
            const grid = document.getElementById('jump-grid');
            grid.innerHTML = '';

            rawQuestions.forEach(q => {
                const btn = document.createElement('button');
                const rec = state.history[q.id];
                let cls = "py-2 rounded-lg text-xs font-bold border transition ";

                if (state.wrongSet.has(q.id)) {
                    cls += "bg-rose-500 text-white border-rose-600 hover:bg-rose-600";
                } else if (rec && rec.isCorrect) {
                    cls += "bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600";
                } else {
                    cls += "bg-slate-50 text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300";
                }

                btn.className = cls;
                btn.textContent = q.id;
                btn.onclick = () => {
                    closeJumpModal();
                    if (state.mode !== 'practice') {
                        switchTab('practice');
                    }
                    // 若在隨機模式下點選特定題號，切回順序模式以精準跳轉
                    if (state.isRandom) {
                        state.isRandom = false;
                        document.getElementById('toggle-random').checked = false;
                        saveState();
                        buildQuestionOrder();
                    }
                    const targetIdx = state.questionOrder.indexOf(q.id);
                    if (targetIdx !== -1) {
                        state.currentIndex = targetIdx;
                        renderQuizCard();
                    }
                };
                grid.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function closeJumpModal() {
            document.getElementById('jump-modal').classList.add('hidden');
        }

        // 重置所有進度
        function resetProgress() {
            if (confirm("確定要清除所有的作答紀錄與錯題本嗎？此動作無法復原。")) {
                state.history = {};
                state.wrongSet.clear();
                localStorage.removeItem(STORAGE_KEY);
                updateStatsUI();
                buildQuestionOrder();
                renderCurrentView();
            }
        }

        // 啟動應用
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
